<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refunds &mdash; AM Restaurant RMIS</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="app">
  <header class="topbar">
    <div class="topbar-brand"><a href="/dashboard">AM <span>RMIS</span></a></div>
    <nav class="topbar-nav">
      <a class="topbar-link" href="/profile">My Profile</a>
      <span class="user-name" id="user-name">&hellip;</span>
      <span class="role-badge" id="user-role">&hellip;</span>
      <button type="button" class="btn-logout" id="logout-btn">Logout</button>
    </nav>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <a class="side-back" href="/dashboard">&larr; All apps</a>
      <div class="side-section">Sales &amp; Billing</div>
      <a class="side-link" href="/sales">Point of Sale</a>
      <a class="side-link" href="/sales-history">Sales History</a>
      <a class="side-link is-active" href="/refunds">Refunds</a>
      <a class="side-link" id="nav-dash" href="/sales-dashboard">Sales Dashboard</a>
    </aside>

    <main class="content">
      <div class="page-head">
        <h1>Refunds</h1>
        <span class="pill pill-live">Live</span>
      </div>

      <div class="notice" id="page-notice" hidden></div>

      <!-- Step 1: find an eligible original transaction. -->
      <div class="card">
        <div class="card-head">Request a refund</div>
        <div class="modal-body">
          <form id="lookup" class="toolbar" novalidate>
            <div class="field-inline">
              <label for="f-bill">Transaction number</label>
              <input class="rmis-input" id="f-bill" placeholder="e.g. OR-001">
            </div>
            <div class="field-inline">
              <label>&nbsp;</label>
              <button type="submit" class="btn-primary">Find transaction</button>
            </div>
          </form>
          <div class="field-err" id="lookup-err"></div>
          <div id="eligible"></div>
        </div>
      </div>

      <div class="toolbar">
        <div class="field-inline">
          <label for="f-status">Status</label>
          <select class="rmis-select" id="f-status">
            <option value="">All requests</option>
            <option>Pending</option><option>Completed</option><option>Rejected</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="card-head">Refund requests</div>
        <table class="mock">
          <thead><tr>
            <th>Refund</th><th>Transaction</th><th class="num">Amount</th><th>Method</th>
            <th>Status</th><th>Requested by</th><th>Reviewed by</th><th></th>
          </tr></thead>
          <tbody id="refund-body"></tbody>
        </table>
        <div class="empty-state" id="refund-empty" hidden>No refund requests to show.</div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modal" hidden><div class="modal modal-wide" id="modal-card"></div></div>

  <script src="/js/rmis-modules.js"></script>
  <script src="/js/rmis-ui.js"></script>
  <script src="/js/refunds.js"></script>
</body>
</html>
