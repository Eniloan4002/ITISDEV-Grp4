<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier &amp; Commissary &mdash; AM Restaurant RMIS</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="app">
  <header class="topbar">
    <div class="topbar-brand"><a href="/dashboard">AM <span>RMIS</span></a></div>
    <nav class="topbar-nav">
      <a class="topbar-link" href="/profile">My Profile</a>
      <span class="user-name" id="user-name">&hellip;</span>
      <span class="role-badge" id="user-role">&hellip;</span>
      <button type="button" class="btn-logout" id="logout-btn">Logout</button>
    </nav>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <a class="side-back" href="/dashboard">&larr; All apps</a>
      <div class="side-section">Inventory &amp; Procurement</div>
      <a class="side-link" href="/inventory">Ingredient Inventory</a>
      <a class="side-link" href="/stock-alerts">Stock Alerts</a>
      <a class="side-link" href="/stock-adjustment">Stock Adjustment</a>
      <a class="side-link" href="/purchase-orders">Purchase Orders</a>
      <a class="side-link is-active" href="/supplier">Supplier &amp; Commissary</a>
    </aside>

    <main class="content">
      <div class="page-head">
        <h1>Supplier Records</h1>
        <span class="pill pill-live">Live</span>
      </div>

      <div class="notice" id="page-notice" hidden></div>

      <div class="toolbar">
        <div class="field-inline">
          <label for="f-search">Search</label>
          <input class="rmis-input" id="f-search" type="search"
                 placeholder="Company, contact, email, phone, TIN or address&hellip;">
        </div>
        <div class="field-inline">
          <label>&nbsp;</label>
          <button type="button" class="btn-primary" id="new-supplier">New supplier</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head">Active suppliers</div>
        <table class="mock">
          <thead><tr>
            <th>Company</th><th>Contact person</th><th>Email</th>
            <th>Phone</th><th>TIN</th><th>Physical address</th><th></th>
          </tr></thead>
          <tbody id="supplier-body"></tbody>
        </table>
        <div class="empty-state" id="supplier-empty" hidden>No suppliers match this search.</div>
      </div>
    </main>
  </div>

  <!-- openModal() in rmis-ui.js writes into these; without them the edit form
       silently fails to appear. -->
  <div class="modal-overlay" id="modal" hidden><div class="modal modal-wide" id="modal-card"></div></div>

  <script src="/js/rmis-modules.js"></script>
  <script src="/js/rmis-ui.js"></script>
  <script src="/js/supplier.js"></script>
</body>
</html>
