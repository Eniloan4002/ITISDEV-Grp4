<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Performance &mdash; AM Restaurant RMIS</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="app">
  <header class="topbar">
    <div class="topbar-brand"><a href="/dashboard">AM <span>RMIS</span></a></div>
    <nav class="topbar-nav">
      <a class="topbar-link" href="/profile">My Profile</a>
      <span class="user-name" id="user-name">&hellip;</span>
      <span class="role-badge" id="user-role">&hellip;</span>
      <button type="button" class="btn-logout" id="logout-btn">Logout</button>
    </nav>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <a class="side-back" href="/dashboard">&larr; All apps</a>
      <div class="side-section">Reporting</div>
      <a class="side-link is-active" href="/employee-performance">Employee Performance</a>
      <a class="side-link" href="/audit-logs">Audit Logs</a>
    </aside>

    <main class="content">
      <div class="page-head">
        <h1>Employee Performance</h1>
        <span class="pill pill-live">Live</span>
      </div>

      <div class="notice" id="page-notice" hidden></div>

      <!-- Filters -->
      <form id="performance-form" class="toolbar" novalidate>
        <div class="field-inline">
          <label for="employee-name">Employee</label>
          <input class="rmis-input" type="text" id="employee-name" placeholder="Search employee&hellip;">
        </div>
        <div class="field-inline">
          <label for="role">Role</label>
          <select class="rmis-select" id="role">
            <option value="">All roles</option>
            <option>Admin</option><option>Manager</option>
            <option>Cashier</option><option>Staff</option>
          </select>
        </div>
        <div class="field-inline">
          <label for="period">Period</label>
          <input class="rmis-input" type="text" id="period" placeholder="e.g. Aug 2026">
        </div>
        <div class="field-inline">
          <label>&nbsp;</label>
          <button type="submit" class="btn-primary">View report</button>
        </div>
        <div class="field-inline">
          <label>&nbsp;</label>
          <button type="button" class="btn-ghost" id="export-btn">Export CSV</button>
        </div>
      </form>

      <!-- Create / edit -->
      <div class="card">
        <div class="card-head">Create or edit a report</div>
        <div class="modal-body">
          <form id="report-editor" novalidate>
            <input type="hidden" id="report-id">
            <div class="form-grid">
              <div class="field-inline"><label>Employee name *</label>
                <input class="rmis-input" id="report-employee-name" required></div>
              <div class="field-inline"><label>Role *</label>
                <select class="rmis-select" id="report-role" required>
                  <option value="">— select —</option>
                  <option>Admin</option><option>Manager</option>
                  <option>Cashier</option><option>Staff</option>
                </select></div>
              <div class="field-inline"><label>Reporting period *</label>
                <input class="rmis-input" id="report-period" placeholder="e.g. Aug 2026" required></div>
              <div class="field-inline"><label>Orders served</label>
                <input class="rmis-input" id="orders-served" type="number" min="0" step="1" value="0"></div>
              <div class="field-inline"><label>Sales (&#8369;)</label>
                <input class="rmis-input" id="sales-amount" type="number" min="0" step="any" value="0"></div>
              <div class="field-inline"><label>Punctuality</label>
                <input class="rmis-input" id="punctuality" placeholder="e.g. On time"></div>
              <div class="field-inline full"><label>Notes</label>
                <input class="rmis-input" id="notes" placeholder="Optional"></div>
            </div>
            <div class="field-err" id="form-message"></div>
            <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap">
              <button type="submit" class="btn-primary">Save report</button>
              <button type="button" class="btn-ghost" id="cancel-edit">Cancel</button>
              <button type="button" class="btn-ghost btn-danger" id="delete-selected">Delete selected</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Results -->
      <div class="card">
        <div class="card-head">Performance breakdown</div>
        <table class="mock">
          <thead><tr>
            <th>Employee</th><th>Role</th><th>Orders served</th>
            <th>Sales</th><th>Punctuality</th><th>Period</th><th></th>
          </tr></thead>
          <tbody id="performance-body">
            <tr><td colspan="7" class="muted">Loading performance data&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- rmis-modules.js defines window.RMIS, which employee-performance.js awaits.
       Without it the page script throws before rendering and the table stays on
       "Loading performance data…". -->
  <script src="/js/rmis-modules.js"></script>
  <script src="/js/rmis-ui.js"></script>
  <script src="/js/employee-performance.js"></script>
</body>
</html>
